<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修复流程 · 拾忆相馆</title>
  <meta name="description" content="拾忆相馆老照片修复流程：上传照片、免费评估报价、精工修复、满意交付，四步足不出户找回旧时光。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2314110d'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23c99a5f' font-family='serif'%3E%E6%8B%BE%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <!-- ============ 导航（内容由 js/layout.js 注入） ============ -->
  <header class="nav nav-solid" id="nav" data-nav></header>

  <main>
    <!-- ============ 页面头部 ============ -->
    <section class="subpage-hero">
      <p class="subpage-crumb"><a href="index.html">首页</a> / 修复流程</p>
      <h1 class="subpage-title">四步，找回旧时光</h1>
      <p class="subpage-desc">足不出户，全程线上沟通；不满意，免费修改到满意为止。</p>
    </section>

    <!-- ============ 流程列表（本页唯一功能模块） ============ -->
    <section class="section subpage-body">
      <ol class="process-list">
        <li class="process-item reveal">
          <span class="process-no">壹</span>
          <h3>上传照片</h3>
          <p>手机拍照即可提交，模糊、破损都不影响评估。</p>
        </li>
        <li class="process-item reveal" style="--d:.1s">
          <span class="process-no">贰</span>
          <h3>免费评估报价</h3>
          <p>说明修复难度与方案，明码标价，确认后再开始。</p>
        </li>
        <li class="process-item reveal" style="--d:.2s">
          <span class="process-no">叁</span>
          <h3>精工修复</h3>
          <p>修图师手工逐帧处理，一般 3–5 个工作日完成。</p>
        </li>
        <li class="process-item reveal" style="--d:.3s">
          <span class="process-no">肆</span>
          <h3>满意交付</h3>
          <p>交付高清数字文件，支持艺术微喷冲印与装裱。</p>
        </li>
      </ol>
    </section>

    <!-- ============ 底部引导 ============ -->
    <section class="subpage-cta">
      <p>流程清楚了，现在就开始吧</p>
      <div class="subpage-cta-actions">
        <a href="index.html#contact" class="btn btn-primary">上传照片 · 免费评估</a>
        <a href="pricing.html" class="btn btn-outline">查看价格</a>
      </div>
    </section>
  </main>

  <!-- ============ 页脚（内容由 js/layout.js 注入） ============ -->
  <footer class="footer" data-footer></footer>

  <!-- 全局悬浮客服（内容由 js/layout.js 注入） -->
  <aside class="floating-widget" id="floatWidget" data-widget aria-label="在线客服"></aside>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
