<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <!-- ============ 导航（内容由 js/layout.js 注入） ============ -->
  <header class="nav nav-solid" id="nav" data-nav></header>

  <main>
    <!-- ============ 页面头部 ============ -->
    <section class="subpage-hero">
      <p class="subpage-crumb"><a href="index.html">首页</a> / 修复案例</p>
      <h1 class="subpage-title">真实修复案例</h1>
      <p class="subpage-desc">拖动每张照片中间的滑块，对比修复前后。每一张背后，都是一个家庭的时光。</p>
    </section>

    <!-- ============ 案例列表（本页唯一功能模块） ============ -->
    <section class="section subpage-body">
      <div class="works-grid">
        <figure class="work-card work-wide reveal">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-01.jpg" alt="修复后的七十年代毕业合影" loading="lazy" />
            <div class="cmp-before-wrap"><img class="cmp-img aged" src="images/works-01.jpg" alt="修复前" loading="lazy"/><div class="damage"></div></div>
            <div class="cmp-handle" aria-hidden="true">
              <span class="cmp-line"></span>
              <span class="cmp-knob"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5 3 12l5 7M16 5l5 7-5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </div>
            <span class="cmp-tag tag-before">修复前</span>
            <span class="cmp-tag tag-after">修复后</span>
          </div>
          <figcaption><span class="work-title">毕业合影 · 1978</span><span class="work-tag-label">划痕去除 / 上色 / 清晰化</span></figcaption>
        </figure>

        <figure class="work-card reveal" style="--d:.08s">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-02.jpg" alt="修复后的五十年代全家福" loading="lazy" />
            <div class="cmp-before-wrap"><img class="cmp-img aged" src="images/works-02.jpg" alt="修复前" loading="lazy"/><div class="damage"></div></div>
            <div class="cmp-handle" aria-hidden="true">
              <span class="cmp-line"></span>

            </div>
            <span class="cmp-tag tag-before">修复前</span>
            <span class="cmp-tag tag-after">修复后</span>
          </div>
          <figcaption><span class="work-title">全家福 · 1956</span><span class="work-tag-label">黑白上色</span></figcaption>
        </figure>

        <figure class="work-card reveal" style="--d:.16s">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-03.jpg" alt="修复后的六十年代结婚照" loading="lazy" />
            <div class="cmp-before-wrap"><img class="cmp-img aged" src="images/works-03.jpg" alt="修复前" loading="lazy"/><div class="damage"></div></div>
            <div class="cmp-handle" aria-hidden="true">
              <span class="cmp-line"></span>
              <span class="cmp-knob"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5 3 12l5 7M16 5l5 7-5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

            <span class="cmp-tag tag-before">修复前</span>
            <span class="cmp-tag tag-after">修复后</span>
          </div>
          <figcaption><span class="work-title">结婚照 · 1962</span><span class="work-tag-label">残缺重建 / 上色</span></figcaption>
        </figure>

        <figure class="work-card reveal">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-04.jpg" alt="修复后的老奶奶肖像" loading="lazy" />
            <div class="cmp-before-wrap"><img class="cmp-img aged" src="images/works-04.jpg" alt="修复前" loading="lazy"/><div class="damage"></div></div>
            <div class="cmp-handle" aria-hidden="true">
              <span class="cmp-line"></span>
              <span class="cmp-knob"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5 3 12l5 7M16 5l5 7-5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </div>
            <span class="cmp-tag tag-before">修复前</span>
            <span class="cmp-tag tag-after">修复后</span>
          </div>
          <figcaption><span class="work-title">祖母肖像 · 1973</span><span class="work-tag-label">霉斑清理 / 精修</span></figcaption>
        </figure>

        <figure class="work-card reveal" style="--d:.08s">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-05.jpg" alt="修复后的童年照片" loading="lazy" />

            <span class="cmp-tag tag-after">修复后</span>
          </div>
          <figcaption><span class="work-title">童年 · 1985</span><span class="work-tag-label">模糊增强</span></figcaption>
        </figure>

        <figure class="work-card work-wide reveal" style="--d:.16s">
          <div class="work-frame comparison">
            <img class="cmp-img cmp-after" src="images/works-06.jpg" alt="修复后的九十年代情侣照片" loading="lazy" />
            <div class="cmp-before-wrap"><img class="cmp-img aged" src="images/works-06.jpg" alt="修复前" loading="lazy"/><div class="damage"></div></div>
            <div class="cmp-handle" aria-hidden="true">
              <span class="cmp-line"></span>
              <span class="cmp-knob"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5 3 12l5 7M16 5l5 7-5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

        </figure>
